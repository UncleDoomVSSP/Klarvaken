name: Release

# Builds the app and attaches Klarvaken.app.zip to a GitHub Release
# whenever a version tag such as v1.2.0 is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build app
        run: ./build.sh

      # The release may already exist if it was created on the GitHub website
      # (which also creates the tag). In that case attach the zip to it;
      # otherwise create the release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Klarvaken.app.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/Klarvaken.app.zip \
              --title "Klarvaken $GITHUB_REF_NAME" \
              --generate-notes
          fi
